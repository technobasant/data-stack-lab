# Targets for the same project. Only duckdb runs in CI; the others are filled in by the
# projects that need them (snowflake/, databricks/, bigquery/).
saas:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      # Relative to where dbt runs (this directory). The scripts always run it here.
      path: "{{ env_var('DUCKDB_PATH', '../data/warehouse.duckdb') }}"
      schema: main
      threads: 4
    databricks:
      # databricks/dbt_build.py: the same project on a Databricks SQL warehouse, catalog dsl.
      type: databricks
      catalog: dsl
      schema: main
      host: "{{ env_var('DATABRICKS_HOST', '') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', '') }}"
      threads: 4
