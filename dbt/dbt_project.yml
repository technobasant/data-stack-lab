name: saas
version: "1.0.0"
config-version: 2
profile: saas

model-paths: ["models"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]

models:
  saas:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
    # The data-quality project: one day's delivery at a time. Off unless its harness
    # turns it on.
    quality:
      +materialized: view
      +schema: quality
      +tags: ["quality"]
      +enabled: "{{ var('quality_module', false) }}"
    # The Airflow project's incremental models. Off unless Airflow turns them on, so the
    # dbt project builds exactly what it always did.
    airflow:
      +materialized: incremental
      +incremental_strategy: delete+insert
      +unique_key: event_id
      +schema: airflow
      +tags: ["airflow"]
      +enabled: "{{ var('airflow_module', false) }}"

snapshots:
  saas:
    +schema: snapshots

data_tests:
  saas:
    +severity: error
