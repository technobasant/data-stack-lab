name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commit SHAs, with the release in a comment; Dependabot
# keeps both current. uv is pinned to the version that wrote uv.lock.
env:
  UV_VERSION: "0.12.23"

jobs:
  checks:
    name: Lint, generator tests and workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: Audit the workflows (zizmor)
        run: uvx zizmor@1.30.1 --offline --persona=regular .github/workflows

  # The whole dbt project at lab scale on both dbt engines: 13 snapshot loads, every
  # model, data test and unit test; then the published figures must come out exactly
  # (results/dbt-scd2.json) and every deliberate break must fail the build.
  dbt:
    name: dbt ${{ matrix.engine }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: Core 1.12
            dbt: ""
          - engine: v2 (dbt-oss 2.0.8)
            dbt: uvx --from dbt-oss==2.0.8 dbt
    env:
      DBT: ${{ matrix.dbt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - name: Generate the dataset
        run: uv run python -m datagen --scale lab --seed 7 --out data
      - name: Replay 13 monthly extracts through dbt snapshot, then dbt build
        run: uv run python scripts/warehouse.py
      - name: The published figures, exactly
        run: uv run python scripts/measure.py --check
      - name: Every deliberate break fails the build
        run: uv run python scripts/mutants.py --check
      - name: dbt docs (catalog and lineage)
        if: matrix.dbt == ''
        working-directory: dbt
        run: DUCKDB_PATH=../data/warehouse.duckdb uv run dbt docs generate --profiles-dir .
      - if: matrix.dbt == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dbt-docs
          path: |
            dbt/target/index.html
            dbt/target/manifest.json
            dbt/target/catalog.json
          retention-days: 30

  # The Airflow project: September backfilled through the real DAGs four ways (in order,
  # a file that lands late and is re-run, newest day first, and Airflow 3's default
  # "@daily"), every incremental table scored against every event that arrived. Exact
  # figures checked.
  airflow:
    name: Airflow 3.3 backfill
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --group airflow
      - name: Generate the dataset
        run: uv run python -m datagen --scale lab --seed 7 --out data
      - name: The DAGs load, and each schedule gives the window the results rely on
        run: uv run pytest -q tests/test_dags.py
      - name: Backfill September four ways; the published figures, exactly
        run: uv run python airflow/backfill.py --check

  # The data-quality project: a month of deliveries with nine injected defects, checked in
  # dbt under two policies (block, quarantine), every row scored against what the defect
  # did to it. Exact figures checked.
  quality:
    name: Data quality, nine defects
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - name: Generate the dataset
        run: uv run python -m datagen --scale lab --seed 7 --out data
      - name: Deliver, check and score September under both policies; the published figures, exactly
        run: uv run python quality/run.py --check

  # The Spark project: re-running one day under each partition overwrite mode, the files
  # a partitioned write produces four ways, and partition pruning. Counts checked exactly;
  # times are recorded, never compared.
  spark:
    name: PySpark 4.2, overwrite, small files, pruning
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --group spark
      - name: Generate the dataset
        run: uv run python -m datagen --scale lab --seed 7 --out data
      - name: Run the three experiments; the published counts, exactly
        run: uv run python spark/run.py --check

  # The Databricks project needs a workspace, so CI cannot re-run it. It checks the part
  # that needs none: the deliveries and each loader's outcome predicted from the documented
  # semantics, exactly. tests/test_databricks.py (in `checks`) holds the recorded workspace
  # run to that prediction.
  databricks:
    name: Databricks, six loaders (the prediction)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - name: Generate the dataset
        run: uv run python -m datagen --scale lab --seed 7 --out data
      - name: Build the deliveries and predict each loader; the published plan, exactly
        run: uv run python databricks/run.py --plan --check
